[project]
name = "tg-shop-miniapp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.146.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.0",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
    "slowapi>=0.1.10",
    "sqlalchemy[asyncio]>=2.1.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes (неиспользуемые импорты и переменные)
    "I",  # isort (сортировка импортов)
    "B",  # flake8-bugbear (поиск потенциальных багов)
]
ignore = [
    "E501", # Длину строки контролирует форматтер, линтер может ругаться
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
